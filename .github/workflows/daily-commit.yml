name: Daily Commit

on:
  schedule:
    - cron: '30 5 * * *'  # Runs daily at 05:30 UTC
  workflow_dispatch:       # Optional: lets you trigger manually

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Update timestamp - 22f2001645@ds.study.iitm.ac.in
        run: |
          echo "Last updated: $(date -u)" > status.txt
          git config --global user.name "DevSync Bot"
          git config --global user.email "22f2001645@ds.study.iitm.ac.in"
          git add status.txt
          git commit -m "Automated daily update"
          git push
